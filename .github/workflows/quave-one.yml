name: Deploy to Quave ONE
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: quave-one
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Did the server change?
        id: changes
        # The API has a volume (single container, no blue-green), so every API deploy is ~a minute of downtime.
        # Only redeploy it when server/ actually changed; the web app is stateless and always deploys.
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^server/' || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp version
        run: git rev-parse --short HEAD > public/version.txt
      - name: Install Quave ONE CLI
        # The installer asks api.github.com for the latest release unauthenticated, which shared runners
        # rate-limit; resolve the tag with the runner's token and hand it over instead.
        env:
          GH_TOKEN: ${{ github.token }}
        # A download can fail its checksum now and then (seen on 0.83.0): retry a few times rather than skip a deploy.
        run: |
          export QUAVEONE_VERSION="$(gh api repos/quaveone/cli/releases/latest --jq .tag_name)"
          echo "Quave ONE CLI $QUAVEONE_VERSION"
          for attempt in 1 2 3; do
            if QUAVEONE_INSTALL_DIR="$HOME/.local/bin" bash -c "$(curl -fsSL https://raw.githubusercontent.com/quaveone/cli/main/install.sh)"; then break; fi
            if [ "$attempt" = 3 ]; then echo "Quave ONE CLI install failed 3 times"; exit 1; fi
            echo "CLI install failed (attempt $attempt), retrying in 10 s"; sleep 10
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy web (heli.filipenevola.com)
        run: quaveone deploy -env filipenevola-rc-heli-sim-web-production -env-token "$QUAVEONE_WEB_ENV_TOKEN" -dir .
        env:
          QUAVEONE_WEB_ENV_TOKEN: ${{ secrets.QUAVEONE_WEB_ENV_TOKEN }}
      - name: Deploy rankings API
        if: steps.changes.outputs.server == 'true'
        run: quaveone deploy -env filipenevola-rc-heli-sim-rankings-production -env-token "$QUAVEONE_API_ENV_TOKEN" -dir .
        env:
          QUAVEONE_API_ENV_TOKEN: ${{ secrets.QUAVEONE_API_ENV_TOKEN }}
