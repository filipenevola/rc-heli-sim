name: Deploy to Quave ONE
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: quave-one
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: git rev-parse --short HEAD > public/version.txt
      - name: Install Quave ONE CLI
        run: |
          QUAVEONE_INSTALL_DIR="$HOME/.local/bin" bash -c "$(curl -fsSL https://raw.githubusercontent.com/quaveone/cli/main/install.sh)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy web (heli.filipenevola.com)
        run: quaveone deploy -env filipenevola-rc-heli-sim-web-production -env-token "$QUAVEONE_WEB_ENV_TOKEN" -dir .
        env:
          QUAVEONE_WEB_ENV_TOKEN: ${{ secrets.QUAVEONE_WEB_ENV_TOKEN }}
      - name: Deploy rankings API
        run: quaveone deploy -env filipenevola-rc-heli-sim-rankings-production -env-token "$QUAVEONE_API_ENV_TOKEN" -dir .
        env:
          QUAVEONE_API_ENV_TOKEN: ${{ secrets.QUAVEONE_API_ENV_TOKEN }}
